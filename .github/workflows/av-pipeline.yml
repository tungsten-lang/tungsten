name: AV pipeline
on:
  pull_request:
    paths: ['runtime/runtime.c', 'runtime/media/**', 'core/media/**', 'apps/studio/**', 'bin/commands/media.w', 'spec/core/media*', '.github/workflows/av-pipeline.yml']
  push:
    branches: [main]
    paths: ['runtime/runtime.c', 'runtime/media/**', 'core/media/**', 'apps/studio/**', 'bin/commands/media.w', 'spec/core/media*', '.github/workflows/av-pipeline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolkit:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/studio/tools/tw/requirements.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: PYTHONPATH=apps/studio/tools/tw python -m unittest discover -s apps/studio/tools/tw/tests -v
  native:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: brew install llvm oniguruma openssl@3 zstd ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/studio/tools/tw/requirements.txt
      - run: bin/tungsten bootstrap --no-bits
      - run: bin/tungsten spec/core/media_transcode_spec.w
      - run: bin/tungsten spec/core/media_delivery_spec.w
      - run: bin/tungsten spec/core/media_precision_spec.w
      - run: bin/tungsten spec/core/media_resume_spec.w
      - run: bin/tungsten spec/core/media_retry_spec.w
      - run: bin/tungsten spec/core/process_spawn_argv_ownership_spec.w
      - run: bin/tungsten spec/parity/media_delivery_contract_spec.w
      - run: bin/tungsten run --interpret spec/parity/media_delivery_contract_spec.w
      - run: PYTHONPATH=apps/studio/tools/tw RUN_AV_NATIVE=1 python -m unittest discover -s apps/studio/tools/tw/tests -p test_native_pipeline.py -v
