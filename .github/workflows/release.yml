name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - VERSION
      - bin/commands/release.sh
      - bin/commands/bootstrap.sh
      - bin/commands/build.w
      - scripts/install-linux-toolchain.sh
      - scripts/package-release.sh
      - scripts/test-build-stage1-cache-identity.rb
      - scripts/validate-release-package.sh

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release preflight and package
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exercise release dry run
        run: bin/tungsten release --dry-run

      - name: Verify tagged PGO build contract
        run: ruby scripts/test-build-stage1-cache-identity.rb

      # The fixture stands in for one release artifact directory: a compiler
      # and, beside it, the compiler images the package must carry. `type -P`
      # names the program on disk; `command -v true` answers with the shell
      # builtin's bare name, which cp cannot copy.
      - name: Build package fixture
        run: |
          mkdir -p build/cache/release-validation/compiler-images build/packages
          fixture="$(type -P true)"
          cp "$fixture" build/cache/release-validation/tungsten-compiler
          cp "$fixture" build/cache/release-validation/compiler-images/tungsten-repl
          cp "$fixture" build/cache/release-validation/compiler-images/tungsten-metal
          scripts/package-release.sh \
            build/cache/release-validation/tungsten-compiler \
            validation-linux-x86_64 build/packages

      - name: Validate package fixture structure
        run: |
          package="tungsten-$(tr -d '[:space:]' < VERSION)-validation-linux-x86_64.tar.gz"
          scripts/validate-release-package.sh "build/packages/$package" validation-linux-x86_64 --structure-only

  build:
    name: ${{ matrix.label }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-15
            target: arm64-apple-macos
            cpu: ""
            artifact_dir: arm64-apple-macos/default
          - label: macos-x86_64-v2
            runner: macos-15-intel
            target: x86_64-apple-macos
            cpu: x86-64-v2
            artifact_dir: x86_64-apple-macos/x86-64-v2
          - label: macos-x86_64-v3
            runner: macos-15-intel
            target: x86_64-apple-macos
            cpu: x86-64-v3
            artifact_dir: x86_64-apple-macos/x86-64-v3
          - label: linux-arm64
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            target: aarch64-unknown-linux-gnu
            cpu: ""
            artifact_dir: aarch64-unknown-linux-gnu/default
          - label: linux-x86_64-v2
            runner: blacksmith-2vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
            cpu: x86-64-v2
            artifact_dir: x86_64-unknown-linux-gnu/x86-64-v2
          - label: linux-x86_64-v3
            runner: blacksmith-2vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
            cpu: x86-64-v3
            artifact_dir: x86_64-unknown-linux-gnu/x86-64-v3

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # LLVM from apt.llvm.org at the pinned major, not the distribution's
      # clang (Ubuntu 24.04 ships LLVM 18); the script puts it first on PATH.
      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: scripts/install-linux-toolchain.sh 22 libonig-dev libzstd-dev

      - name: Install macOS runtime dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install llvm oniguruma zstd
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"
          bundler-cache: true

      - name: Build release compiler
        env:
          TARGET: ${{ matrix.target }}
          CPU: ${{ matrix.cpu }}
        # --strict: a stage 1 / stage 2 IR mismatch exits non-zero before any
        # compiler is installed or any artifact is built, so this step is the
        # release's stage-identity gate. (--pgo, --target and CI imply it; it
        # is spelled out because the job depends on it.) The same build writes
        # the artifact's repl and metal compiler images beside the compiler.
        run: |
          args=(--release --pgo --target "$TARGET")
          args+=(--strict)
          if [[ -n "$CPU" ]]; then args+=(--cpu "$CPU"); fi
          bin/tungsten bootstrap "${args[@]}"

      - name: Verify PGO release artifact
        env:
          ARTIFACT_DIR: ${{ matrix.artifact_dir }}
        run: |
          compiler="build/releases/$ARTIFACT_DIR/tungsten-compiler"
          stamp="$compiler.pgo"
          if command -v sha256sum >/dev/null 2>&1; then
            compiler_sha="$(sha256sum "$compiler" | awk '{print $1}')"
          else
            compiler_sha="$(shasum -a 256 "$compiler" | awk '{print $1}')"
          fi
          grep -Fxq 'tungsten-compiler-pgo-v1' "$stamp"
          grep -Fxq 'profile=compiler-pgo-v2' "$stamp"
          grep -Fxq "compiler_sha256=$compiler_sha" "$stamp"

      - name: Package release
        env:
          ARTIFACT_DIR: ${{ matrix.artifact_dir }}
          TARGET_LABEL: ${{ matrix.label }}
        run: |
          scripts/package-release.sh \
            "build/releases/$ARTIFACT_DIR/tungsten-compiler" \
            "$TARGET_LABEL" build/packages

      - name: Validate release package
        env:
          TARGET_LABEL: ${{ matrix.label }}
        run: |
          package="tungsten-$(tr -d '[:space:]' < VERSION)-$TARGET_LABEL.tar.gz"
          scripts/validate-release-package.sh "build/packages/$package" "$TARGET_LABEL"

      # The packaged toolchain, end to end, on the profiles a user reaches
      # first: check, the default run (compile through WIRE, link the native
      # runtime archive, execute), and a --release build (whole-program LTO
      # against the runtime bitcode). The example sits inside the package, so
      # its core/ and runtime/ are the package's own.
      - name: Smoke packaged compiler
        env:
          TARGET_LABEL: ${{ matrix.label }}
        run: |
          package="tungsten-$(tr -d '[:space:]' < VERSION)-$TARGET_LABEL"
          mkdir build/package-smoke
          tar -xzf "build/packages/$package.tar.gz" -C build/package-smoke
          tungsten="build/package-smoke/$package/bin/tungsten"
          hello="build/package-smoke/$package/doc/examples/01-basics/hello.w"
          "$tungsten" -c "$hello"
          [[ "$("$tungsten" "$hello")" == "hello world" ]]
          "$tungsten" -o build/package-smoke/hello-release --release "$hello"
          [[ "$(build/package-smoke/hello-release)" == "hello world" ]]

      - name: Attest package
        uses: actions/attest@v4
        with:
          subject-path: build/packages/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: tungsten-${{ matrix.label }}
          path: build/packages/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tungsten-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/*.tar.gz dist/SHA256SUMS
          --repo "${{ github.repository }}"
          --verify-tag
          --generate-notes
          --title "Tungsten ${GITHUB_REF_NAME#v}"
